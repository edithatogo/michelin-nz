name: Scheduled Data Sync & Deployment

on:
  push:
    branches: [ main ]
  schedule:
    # Runs at 00:00 UTC daily
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  sync_and_deploy:
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Create Python Virtual Environment
        run: |
          python -m venv .venv
          .venv/bin/pip install polars requests beautifulsoup4 pyarrow huggingface_hub

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Project
        env:
          OBSERVABLE_TELEMETRY_DISABLE: true
        run: npm run build

      - name: Run Playwright Tests
        timeout-minutes: 3
        run: |
          npx playwright install chromium
          npm run smoke:dist

      - name: Deploy to Hugging Face Spaces
        if: ${{ env.HF_TOKEN != '' }}
        run: |
          test -n "$HF_TOKEN"
          cp README.md dist/README.md
          .venv/bin/python - <<'PY'
          import os
          from huggingface_hub import HfApi

          repo_id = "edithatogo/michelin-nz"
          api = HfApi(token=os.environ["HF_TOKEN"])
          api.create_repo(
              repo_id=repo_id,
              repo_type="space",
              space_sdk="static",
              private=False,
              exist_ok=True,
          )
          api.upload_folder(
              repo_id=repo_id,
              repo_type="space",
              folder_path="dist",
              commit_message="deploy: update dashboard build",
          )
          PY
