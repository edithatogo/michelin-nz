name: Scheduled Data Sync & Deployment

on:
  push:
    branches: [main]
  schedule:
    # Runs at 00:00 UTC daily
    - cron: "0 0 * * *"
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  sync_and_deploy:
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Pixi
        run: |
          curl -fsSL https://pixi.sh/install.sh | bash
          echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"

      - name: Verify Python and Mojo Toolchain
        run: |
          pixi run python --version
          pixi run mojo-version
          pixi run mojo-format-check
          pixi run mojo-build

      - name: Install Node Dependencies
        run: npm ci

      - name: Run Strict Python Quality Gates
        run: |
          pixi run format-check
          pixi run lint
          pixi run pytest --cov=src/data --cov-fail-under=85
          pixi run typecheck

      - name: Run Strict JavaScript Quality Gates
        run: |
          npm run lint
          npm run format:check
          npm run audit

      - name: Build Project
        env:
          OBSERVABLE_TELEMETRY_DISABLE: true
        run: npm run build

      - name: Run Playwright Tests
        timeout-minutes: 3
        env:
          PLAYWRIGHT_BROWSER_CHANNEL: chrome
        run: npm run smoke:dist

      - name: Deploy to Hugging Face Spaces
        run: |
          set -euo pipefail
          test -n "$HF_TOKEN"
          cp README.md dist/README.md
          pixi run python - <<'PY'
          import os
          from huggingface_hub import HfApi

          repo_id = "edithatogo/michelin-nz"
          api = HfApi(token=os.environ["HF_TOKEN"])
          api.create_repo(
              repo_id=repo_id,
              repo_type="space",
              space_sdk="static",
              private=False,
              exist_ok=True,
          )
          api.upload_folder(
              repo_id=repo_id,
              repo_type="space",
              folder_path="dist",
              delete_patterns=["*"],
              commit_message="deploy: update dashboard build",
          )
          PY
