name: External Deployment Check

on:
  workflow_dispatch:
  schedule:
    # Weekly, after regular daily deployment has had time to complete.
    - cron: '30 1 * * 1'

jobs:
  external-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: python -m pip install requests

      - name: Verify GitHub, Hugging Face, and Zenodo
        run: python scripts/check_external_deployments.py
