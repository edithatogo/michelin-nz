name: External Deployment Check

on:
  workflow_dispatch:
  schedule:
    # Weekly, after regular daily deployment has had time to complete.
    - cron: "30 1 * * 1"

jobs:
  external-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Pixi
        run: |
          curl -fsSL https://pixi.sh/install.sh | bash
          echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"

      - name: Verify GitHub, Hugging Face, and Zenodo
        env:
          REQUIRE_GITHUB_RELEASE: "1"
          REQUIRE_ZENODO: "1"
        run: pixi run python scripts/check_external_deployments.py
