name: Project & Release Setup

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write
  issues: write
  repository-projects: write

jobs:
  setup-repo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure Repository Metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh repo edit $GITHUB_REPOSITORY --description "Observable dashboard for aggregate gastronomy indicators, population, and GDP analysis." --homepage "https://huggingface.co/spaces/edithatogo/michelin-nz" --add-topic "data-science,gastronomy,dashboard,polars,observablehq,python,aggregate-analysis" || echo "Repository metadata update requires an admin-scoped token; continuing."

      - name: Create or Update Release v1.0.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v1.0.0 --title "Release v1.0.0 - Aggregate Gastronomy Indicator Dashboard" --notes "Initial release including aggregate-only Polars data pipeline, Pytest suite, source/licensing notes, and Observable Framework static build." || echo "Release already exists"

      - name: Create Initial Issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create --title "Improve aggregate GDP and gastronomy indicator visualizations" --body "Add more aggregate-only visual correlations and source provenance notes." || echo "Issue already created"
          gh issue create --title "Review additional aggregate public data sources" --body "Evaluate candidate aggregate-only sources and document redistribution rights before adding any metrics." || echo "Issue already created"
