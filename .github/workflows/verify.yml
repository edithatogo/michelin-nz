name: Verify Code Quality & Testing

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Pixi
        run: |
          curl -fsSL https://pixi.sh/install.sh | bash
          echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"

      - name: Verify Mojo Toolchain
        run: |
          pixi run mojo-version
          pixi run mojo-format-check
          pixi run mojo-build

      - name: Run Python Formatter Check (Ruff)
        run: pixi run format-check

      - name: Run Python Linter (Ruff)
        run: pixi run lint

      - name: Run Python Test Suite (Pytest)
        run: pixi run pytest --cov=src/data --cov-fail-under=85

      - name: Run Repository Programmatic Contract Verification
        run: pixi run python scripts/verify_repo_contract.py

      - name: Run Conductor Contract Verification
        run: pixi run conductor-contracts

      - name: Install Node Dependencies
        run: npm ci

      - name: Run Python Typechecker (basedpyright)
        run: pixi run typecheck

      - name: Run Javascript Linter (ESLint)
        run: npm run lint

      - name: Run Javascript Formatter Check (Prettier)
        run: npm run format:check

      - name: Run NPM Audit
        run: npm run audit

      - name: Compile Dashboard Build
        env:
          OBSERVABLE_TELEMETRY_DISABLE: true
        run: npm run build

      - name: Run Static Site Smoke Tests
        timeout-minutes: 3
        env:
          PLAYWRIGHT_BROWSER_CHANNEL: chrome
        run: npm run smoke:dist
