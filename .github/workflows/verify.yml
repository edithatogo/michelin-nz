name: Verify Code Quality & Testing

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install polars requests beautifulsoup4 pyarrow pytest pytest-cov hypothesis ruff basedpyright

      - name: Run Python Linter (Ruff)
        run: .venv/bin/ruff check src/data/ tests/

      - name: Run Python Test Suite (Pytest)
        run: .venv/bin/pytest --cov=src/data --cov-fail-under=85

      - name: Run Repository Programmatic Contract Verification
        env:
          SKIP_EXTERNAL_DEPLOYMENT_CHECK: "1"
        run: .venv/bin/python scripts/verify_repo_contract.py

      - name: Install Node Dependencies
        run: npm ci

      - name: Run Python Typechecker (basedpyright)
        run: npx basedpyright src/data/

      - name: Run Javascript Linter (ESLint)
        run: npm run lint

      - name: Compile Dashboard Build
        run: npm run build
