[project]
name = "michelin-nz"
version = "1.0.0"
description = "Michelin Star Per-Capita Dashboard Python Tooling"
authors = ["edithatogo"]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[dependencies]
python = ">=3.11"
pandas = ">=2.0.0"
requests = ">=2.30.0"
beautifulsoup4 = ">=4.12.0"
pyarrow = ">=12.0.0"
pytest = ">=7.0.0"
pytest-cov = ">=4.0.0"
hypothesis = ">=6.0.0"
ruff = ">=0.1.0"
basedpyright = ">=1.0.0"
mutmut = ">=2.4.0"
scalene = ">=1.5.0"

[tasks]
test = "pytest"
lint = "ruff check src/data/"
format = "ruff format src/data/"
typecheck = "basedpyright src/data/"
mutate = "mutmut run"
profile = "scalene src/data/michelin.py"
