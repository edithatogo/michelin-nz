[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "UP",       # pyupgrade
    "B",        # bugbear
    "A",        # builtins
    "COM",      # commas
    "C4",       # comprehensions
    "PT",       # pytest-style
    "ARG",      # unused-arguments
    "TD",       # todos
    "PL",       # pylint
    "RUF"       # ruff-specific rules
]
ignore = []

[tool.basedpyright]
typeCheckingMode = "strict"
pythonVersion = "3.11"
reportMissingTypeStubs = "warning"
reportUnknownMemberType = "none" # Allow Pandas untyped members
reportUnknownVariableType = "none"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src/data --cov-report=term-missing"
